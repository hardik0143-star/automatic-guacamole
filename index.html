<meta property="og:type" content="website">

<meta property="og:title" content="Tiny Tiffin v1.1 Professional Edition">

<meta property="og:description" content="Healthy Tiffins • Happy Kids • AI Powered">

<meta property="og:image" content="icon-512.png?v=1.5">

<meta name="twitter:card" content="summary_large_image">

<meta name="twitter:title" content="Tiny Tiffin">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

<script>
try{
const theme=JSON.parse(localStorage.getItem("tt_theme")||'"light"');
document.documentElement.setAttribute("data-theme",theme);
}catch(e){}
</script>

</head>

<body>

<div id="app">

<noscript>

Tiny Tiffin requires JavaScript to provide recipes and AI-powered features.

</noscript>

</div>

<script src="recipes.js"></script>

<script src="i18n.js"></script>

<script src="site-config.js"></script>

<script src="store.js"></script>

<script src="content-translator.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
if(window.TINY_TIFFIN_CONFIG?.emailjs?.enabled){

emailjs.init({
publicKey:window.TINY_TIFFIN_CONFIG.emailjs.publicKey
});

}
</script>

<script src="app.js"></script>

<script>

if("serviceWorker" in navigator){

window.addEventListener("load",()=>{

navigator.serviceWorker.register("sw.js").then(reg=>{

reg.addEventListener("updatefound",()=>{

const worker=reg.installing;

worker.addEventListener("statechange",()=>{

if(worker.state==="installed" && navigator.serviceWorker.controller){

window.dispatchEvent(new Event("TinyTiffinUpdateAvailable"));

}

});

});

}).catch(()=>{});

});

}

</script>

</body>

</html>
